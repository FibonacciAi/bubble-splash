<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loading GME 5D Chess…</title>
<meta name="theme-color" content="#050506">
<style>
html,body{height:100%;margin:0;background:#050506;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{height:100%;display:grid;place-items:center;text-align:center;padding:24px}b{color:#ff4761;letter-spacing:.14em}.bar{width:min(280px,75vw);height:5px;border-radius:99px;background:#222;overflow:hidden;margin:18px auto}.bar:after{content:"";display:block;width:40%;height:100%;background:#e21836;animation:m 1s infinite ease-in-out}@keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}#error{display:none;color:#ffd7de;max-width:520px;line-height:1.5}
</style>
</head>
<body><main><div id="loading"><b>GME 5D CHESS</b><div class="bar"></div><div>Opening the multiverse…</div></div><div id="error"></div></main>
<script>
(async()=>{
  try{
    const files=[
      'parts/part-00.txt',
      'parts/part-01.txt',
      'parts/part-02.txt',
      'parts/rules-0.txt',
      'parts/rules-1.txt',
      'parts/rules-2-0.txt',
      'parts/rules-2-1.txt',
      'parts/rules-2-2.txt',
      'parts/rules-2-3.txt',
      'parts/rules-3.txt',
      'parts/fix-03b.txt',
      'parts/part-04.txt',
      'parts/part-05.txt',
      'parts/render-0.txt',
      'parts/render-1.txt',
      'parts/render-2.txt',
      'parts/render-3.txt',
      'parts/render-4.txt',
      'parts/render-5.txt',
      'parts/render-6.txt',
      'parts/part-07.txt',
      'parts/part-08.txt'
    ];
    const parts=[];
    for(const file of files){
      const response=await fetch(file,{cache:'no-store'});
      if(!response.ok) throw new Error(`${file}: HTTP ${response.status}`);
      parts.push((await response.text()).trim());
    }
    const payload=parts.join('');
    if(payload.length!==77812) throw new Error(`payload length ${payload.length}; expected 77812`);
    if(globalThis.crypto?.subtle){
      const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(payload));
      const hash=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
      if(hash!=='46ff6c6166714e08d75ea6bc0e48ee70313f33d43c7b4fad7eb781ad91026e78') throw new Error('integrity check failed');
    }
    const binary=atob(payload);
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const html=new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loading').style.display='none';
    const error=document.getElementById('error');
    error.style.display='block';
    error.textContent=`Could not load the game: ${err.message}`;
    console.error(err);
  }
})();
</script></body></html>
